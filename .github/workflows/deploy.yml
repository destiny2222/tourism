name: Deploy Laravel to Namecheap cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Namecheap
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, fileinfo, gd, curl, pdo, pdo_mysql

      - name: Install Composer Dependencies
        run: composer install --no-dev --optimize-autoloader --no-progress --prefer-dist

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install NPM Dependencies & Build Assets
        run: |
          npm ci || npm install
          npm run build

      - name: Sync files via Rsync over SSH
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.NAMECHEAP_SSH_KEY }}
          ARGS: "-rlptgoDzK --delete"
          SOURCE: "/"
          REMOTE_HOST: ${{ secrets.NAMECHEAP_HOST }}
          REMOTE_USER: ${{ secrets.NAMECHEAP_USERNAME }}
          REMOTE_PORT: ${{ secrets.NAMECHEAP_PORT }}
          TARGET: "/home/${{ secrets.NAMECHEAP_USERNAME }}/public_html"
          EXCLUDES: |
            /.git/
            /.github/
            /storage/framework/cache/
            /storage/logs/
            /.env
            /node_modules/

      - name: Run Remote Artisan Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.NAMECHEAP_HOST }}
          username: ${{ secrets.NAMECHEAP_USERNAME }}
          key: ${{ secrets.NAMECHEAP_SSH_KEY }}
          port: ${{ secrets.NAMECHEAP_PORT }}
          script: |
            cd /home/${{ secrets.NAMECHEAP_USERNAME }}/public_html
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

