name: Deploy to Namecheap via SSH

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to Namecheap
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, gd, zip
          coverage: none

      - name: Install Composer Dependencies
        run: |
          composer install --no-dev --prefer-dist --optimize-autoloader --no-progress --no-interaction

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install NPM Dependencies & Build Assets (Vite)
        run: |
          npm ci || npm install
          npm run build

      - name: Deploy to Namecheap via Rsync over SSH
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.NAMECHEAP_SSH_KEY }}
          ARGS: "-rlgoDzvc -i --delete"
          SOURCE: "/"
          REMOTE_HOST: ${{ secrets.NAMECHEAP_HOST }}
          REMOTE_USER: ${{ secrets.NAMECHEAP_USERNAME }}
          REMOTE_PORT: ${{ secrets.NAMECHEAP_PORT || '21098' }}
          TARGET: /home/${{ secrets.SSH_USERNAME }}/public_html
          EXCLUDES: |
            /.git/
            /.github/
            /node_modules/
            /.env*
            /storage/*.key
            /storage/logs/
            /storage/framework/cache/
            /storage/framework/sessions/
            /storage/framework/views/
            /tests/
            /phpunit.xml
            /.phpunit.result.cache

      - name: Execute Post-Deployment Commands on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.NAMECHEAP_HOST }}
          username: ${{ secrets.NAMECHEAP_USERNAME }}
          key: ${{ secrets.NAMECHEAP_SSH_KEY }}
          port: ${{ secrets.NAMECHEAP_PORT || '21098' }}
          script_stop: true
          script: |
            cd /home/${{ secrets.SSH_USERNAME }}/public_html

            # Detect PHP CLI on Namecheap (uses ea-php82 or default php)
            if [ -f "/usr/local/bin/ea-php82" ]; then
              PHP_BIN="/usr/local/bin/ea-php82"
            elif [ -f "/usr/local/bin/ea-php81" ]; then
              PHP_BIN="/usr/local/bin/ea-php81"
            else
              PHP_BIN="php"
            fi

            echo "Using PHP binary: $PHP_BIN"

            # Create storage symlink if missing
            $PHP_BIN artisan storage:link || true

            # Run database migrations
            $PHP_BIN artisan migrate --force

            # Optimize cache
            $PHP_BIN artisan optimize:clear
            $PHP_BIN artisan config:cache
            $PHP_BIN artisan route:cache
            $PHP_BIN artisan view:cache

            echo "Deployment completed successfully!"
